<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background -->
  <circle cx="60" cy="60" r="56" fill="#0d1a2d" stroke="#00FFFF" stroke-width="2"/>

  <!-- Web connections (API routes) -->
  <g stroke="#00FFFF" stroke-width="1" opacity="0.5">
    <line x1="60" y1="60" x2="20" y2="25"/>
    <line x1="60" y1="60" x2="100" y2="25"/>
    <line x1="60" y1="60" x2="15" y2="60"/>
    <line x1="60" y1="60" x2="105" y2="60"/>
    <line x1="60" y1="60" x2="20" y2="95"/>
    <line x1="60" y1="60" x2="100" y2="95"/>
    <line x1="60" y1="60" x2="60" y2="18"/>
    <line x1="60" y1="60" x2="60" y2="102"/>
  </g>

  <!-- Connection nodes (endpoints) -->
  <g fill="#00FFFF">
    <circle cx="20" cy="25" r="4"/>
    <circle cx="100" cy="25" r="4"/>
    <circle cx="15" cy="60" r="4"/>
    <circle cx="105" cy="60" r="4"/>
    <circle cx="20" cy="95" r="4"/>
    <circle cx="100" cy="95" r="4"/>
    <circle cx="60" cy="18" r="4"/>
    <circle cx="60" cy="102" r="4"/>
  </g>

  <!-- Spider body - central hub -->
  <g fill="#FFFFFF">
    <!-- Abdomen -->
    <ellipse cx="60" cy="68" rx="16" ry="20"/>
    <!-- Cephalothorax -->
    <circle cx="60" cy="48" r="14"/>
  </g>

  <!-- Spider legs (8 legs = 8 connections) -->
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none">
    <!-- Left legs -->
    <path d="M48 45 L35 32 L28 35"/>
    <path d="M46 52 L30 48 L22 52"/>
    <path d="M46 58 L30 62 L22 68"/>
    <path d="M48 72 L35 82 L28 88"/>
    <!-- Right legs -->
    <path d="M72 45 L85 32 L92 35"/>
    <path d="M74 52 L90 48 L98 52"/>
    <path d="M74 58 L90 62 L98 68"/>
    <path d="M72 72 L85 82 L92 88"/>
  </g>

  <!-- Eyes (multiple like spider) -->
  <g fill="#00FFFF">
    <circle cx="54" cy="44" r="3"/>
    <circle cx="66" cy="44" r="3"/>
    <circle cx="54" cy="52" r="2"/>
    <circle cx="66" cy="52" r="2"/>
  </g>

</svg>