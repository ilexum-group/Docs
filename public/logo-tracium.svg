<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFFF"/>
      <stop offset="100%" style="stop-color:#00CCCC"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="60" cy="60" r="56" fill="#0d1a2d" stroke="#00FFFF" stroke-width="2"/>

  <!-- Bloodhound head - minimal geometric -->
  <g fill="#FFFFFF">
    <!-- Head -->
    <path d="M60 25 C78 25 90 40 90 55 L90 65 C90 75 80 82 70 82 L50 82 C40 82 30 75 30 65 L30 55 C30 40 42 25 60 25Z"/>
    <!-- Left ear -->
    <ellipse cx="35" cy="38" rx="12" ry="20" transform="rotate(-20 35 38)"/>
    <!-- Right ear -->
    <ellipse cx="85" cy="38" rx="12" ry="20" transform="rotate(20 85 38)"/>
    <!-- Snout -->
    <ellipse cx="60" cy="68" rx="18" ry="12"/>
  </g>

  <!-- Eyes -->
  <circle cx="48" cy="52" r="6" fill="#0d1a2d"/>
  <circle cx="72" cy="52" r="6" fill="#0d1a2d"/>
  <circle cx="48" cy="52" r="3" fill="#00FFFF"/>
  <circle cx="72" cy="52" r="3" fill="#00FFFF"/>

  <!-- Nose -->
  <ellipse cx="60" cy="72" rx="6" ry="4" fill="#00FFFF"/>

  <!-- Tweezers - simple -->
  <g stroke="#00FFFF" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M82 75 L92 55 L94 56"/>
    <path d="M86 77 L96 57 L94 56"/>
    <!-- Evidence dot -->
    <circle cx="94" cy="56" r="3" fill="#FFFFFF" stroke="none"/>
  </g>

  <!-- Simple data trail -->
  <g fill="#00FFFF" opacity="0.7">
    <circle cx="22" cy="78" r="3"/>
    <circle cx="15" cy="88" r="2"/>
  </g>
</svg>