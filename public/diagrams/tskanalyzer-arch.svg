<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <!-- TSKAnalyzer Architecture -->
  <text x="200" y="15" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#f7fafc" text-anchor="middle">TSKAnalyzer Architecture</text>

  <rect x="125" y="25" width="150" height="35" rx="4" fill="#2d3748" stroke="#4a5568" stroke-width="1.5"/>
  <text x="200" y="48" font-family="system-ui,sans-serif" font-size="11" fill="#f7fafc" text-anchor="middle">Disk / Device</text>

  <line x1="200" y1="60" x2="200" y2="80" stroke="#718096" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="30" y="80" width="340" height="130" rx="4" fill="#2d3748" stroke="#4a5568" stroke-width="1.5"/>
  <text x="200" y="102" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#f7fafc" text-anchor="middle">TSKAnalyzer</text>

  <rect x="50" y="115" width="85" height="65" rx="3" fill="#1a202c" stroke="#4a5568" stroke-width="1"/>
  <text x="92" y="143" font-family="ui-monospace,monospace" font-size="12" fill="#f7fafc" text-anchor="middle">mmls</text>
  <text x="92" y="160" font-family="system-ui,sans-serif" font-size="8" fill="#718096" text-anchor="middle">Partition listing</text>
  <text x="92" y="173" font-family="system-ui,sans-serif" font-size="8" fill="#4a5568" text-anchor="middle">List partitions</text>

  <rect x="157" y="115" width="85" height="65" rx="3" fill="#1a202c" stroke="#4a5568" stroke-width="1"/>
  <text x="199" y="143" font-family="ui-monospace,monospace" font-size="12" fill="#f7fafc" text-anchor="middle">fsstat</text>
  <text x="199" y="160" font-family="system-ui,sans-serif" font-size="8" fill="#718096" text-anchor="middle">Filesystem stats</text>
  <text x="199" y="173" font-family="system-ui,sans-serif" font-size="8" fill="#4a5568" text-anchor="middle">Volume metadata</text>

  <rect x="264" y="115" width="85" height="65" rx="3" fill="#1a202c" stroke="#4a5568" stroke-width="1"/>
  <text x="306" y="143" font-family="ui-monospace,monospace" font-size="12" fill="#f7fafc" text-anchor="middle">fls</text>
  <text x="306" y="160" font-family="system-ui,sans-serif" font-size="8" fill="#718096" text-anchor="middle">File listing</text>
  <text x="306" y="173" font-family="system-ui,sans-serif" font-size="8" fill="#4a5568" text-anchor="middle">Deleted files</text>

  <line x1="200" y1="78" x2="92" y2="115" stroke="#718096" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#a1)"/>
  <line x1="200" y1="78" x2="199" y2="115" stroke="#718096" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#a1)"/>
  <line x1="200" y1="78" x2="306" y2="115" stroke="#718096" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#a1)"/>

  <line x1="200" y1="210" x2="200" y2="225" stroke="#718096" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="115" y="225" width="170" height="40" rx="4" fill="#1a365d" stroke="#4299e1" stroke-width="1.5"/>
  <text x="200" y="250" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#f7fafc" text-anchor="middle">TSKAnalysis</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#718096"/>
    </marker>
  </defs>
