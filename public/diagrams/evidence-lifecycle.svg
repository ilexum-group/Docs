<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <!-- Evidence Lifecycle -->
  <text x="300" y="15" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Evidence Lifecycle</text>

  <rect x="25" y="35" width="85" height="50" rx="4" fill="#2d3748" stroke="#4a5568" stroke-width="1.5"/>
  <text x="67" y="60" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#f7fafc" text-anchor="middle">Collect</text>
  <text x="67" y="76" font-family="system-ui,sans-serif" font-size="9" fill="#718096" text-anchor="middle">Bitex • Evidex</text>

  <line x1="110" y1="60" x2="145" y2="60" stroke="#718096" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="145" y="35" width="85" height="50" rx="4" fill="#2d3748" stroke="#4a5568" stroke-width="1.5"/>
  <text x="187" y="60" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#f7fafc" text-anchor="middle">Transmit</text>
  <text x="187" y="76" font-family="system-ui,sans-serif" font-size="9" fill="#718096" text-anchor="middle">HTTP POST</text>

  <line x1="230" y1="60" x2="265" y2="60" stroke="#718096" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="265" y="35" width="85" height="50" rx="4" fill="#2d3748" stroke="#4a5568" stroke-width="1.5"/>
  <text x="307" y="60" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#f7fafc" text-anchor="middle">Process</text>
  <text x="307" y="76" font-family="system-ui,sans-serif" font-size="9" fill="#718096" text-anchor="middle">Analysis</text>

  <line x1="350" y1="60" x2="385" y2="60" stroke="#718096" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="385" y="35" width="85" height="50" rx="4" fill="#2d3748" stroke="#4a5568" stroke-width="1.5"/>
  <text x="427" y="60" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#f7fafc" text-anchor="middle">Store</text>
  <text x="427" y="76" font-family="system-ui,sans-serif" font-size="9" fill="#718096" text-anchor="middle">Repository</text>

  <rect x="265" y="100" width="100" height="50" rx="4" fill="#1a365d" stroke="#4299e1" stroke-width="1.5"/>
  <text x="315" y="122" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#f7fafc" text-anchor="middle">Correlate</text>
  <text x="315" y="138" font-family="system-ui,sans-serif" font-size="9" fill="#bee3f8" text-anchor="middle">Cross-agent</text>

  <line x1="307" y1="85" x2="307" y2="100" stroke="#718096" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="350" y1="60" x2="350" y2="85" stroke="#718096" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#a1)"/>
  <line x1="350" y1="85" x2="365" y2="100" stroke="#718096" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#a1)"/>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#718096"/>
    </marker>
  </defs>
</svg>