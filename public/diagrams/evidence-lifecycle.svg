<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111a2a"/>
    </linearGradient>

    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <!-- Stage cards -->
  <rect x="36" y="88" width="138" height="84" rx="10" fill="#1a2537" stroke="#3a4a62" stroke-width="1.5"/>
  <text x="105" y="120" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#f8fbff" text-anchor="middle">Collect</text>
  <text x="105" y="144" font-family="system-ui,sans-serif" font-size="11" fill="#9fb2c9" text-anchor="middle">Bitex and Evidex</text>

  <rect x="204" y="88" width="138" height="84" rx="10" fill="#1a2537" stroke="#3a4a62" stroke-width="1.5"/>
  <text x="273" y="120" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#f8fbff" text-anchor="middle">Transmit</text>
  <text x="273" y="144" font-family="system-ui,sans-serif" font-size="11" fill="#9fb2c9" text-anchor="middle">Authenticated HTTP</text>

  <rect x="372" y="88" width="138" height="84" rx="10" fill="#1a2537" stroke="#3a4a62" stroke-width="1.5"/>
  <text x="441" y="120" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#f8fbff" text-anchor="middle">Process</text>
  <text x="441" y="144" font-family="system-ui,sans-serif" font-size="11" fill="#9fb2c9" text-anchor="middle">Normalize and enrich</text>

  <rect x="540" y="88" width="184" height="84" rx="10" fill="#1a2537" stroke="#3a4a62" stroke-width="1.5"/>
  <text x="632" y="120" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#f8fbff" text-anchor="middle">Store</text>
  <text x="632" y="144" font-family="system-ui,sans-serif" font-size="11" fill="#9fb2c9" text-anchor="middle">Forensic repository and index</text>

  <!-- Main flow arrows -->
  <line x1="174" y1="130" x2="204" y2="130" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="342" y1="130" x2="372" y2="130" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="130" x2="540" y2="130" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Correlation lane -->
  <rect x="298" y="190" width="220" height="46" rx="10" fill="#0f2745" stroke="url(#highlight)" stroke-width="2"/>
  <text x="408" y="211" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#dff7ff" text-anchor="middle">Correlate</text>
  <text x="408" y="226" font-family="system-ui,sans-serif" font-size="10" fill="#9adcf1" text-anchor="middle">Cross-agent timeline and custody linkage</text>

  <line x1="441" y1="172" x2="441" y2="188" stroke="#7dd3fc" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="540" y1="130" x2="530" y2="130" stroke="transparent"/>
  <path d="M540 152 C 535 176, 510 192, 490 199" fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
</svg>